name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test AdsGamepadService.sln -c Release

      - name: Publish service
        run: dotnet publish src/AdsGamepadService -c Release -r win-x64 --self-contained -o packaging/AdsGamepadService.Service/bin

      - name: Check version consistency
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$service = Get-Content packaging/AdsGamepadService.Service/AdsGamepadService.Service.nuspec
          [xml]$workload = Get-Content packaging/AdsGamepad.XAR/AdsGamepad.XAR.Workload.nuspec
          [xml]$csproj = Get-Content src/AdsGamepadService/AdsGamepadService.csproj
          $versions = @(
            $service.package.metadata.version,
            $workload.package.metadata.version,
            (($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1)
          )
          $mismatched = $versions | Where-Object { $_ -ne $tagVersion }
          if ($mismatched) {
            throw "Version mismatch: tag $tagVersion but found $($versions -join ', '). Update the two nuspec files and the csproj before tagging."
          }

      - name: Pack TwinCAT packages
        shell: pwsh
        run: |
          nuget pack packaging/AdsGamepadService.Service/AdsGamepadService.Service.nuspec -OutputDirectory package-output -NoPackageAnalysis
          if ($LASTEXITCODE -ne 0) { throw 'Packing the service package failed.' }
          nuget pack packaging/AdsGamepad.XAR/AdsGamepad.XAR.Workload.nuspec -OutputDirectory package-output -NoPackageAnalysis
          if ($LASTEXITCODE -ne 0) { throw 'Packing the workload package failed.' }

      - uses: actions/upload-artifact@v7
        with:
          name: twincat-package
          path: package-output/*.nupkg

      - name: Push to GitHub Packages
        if: github.ref_type == 'tag'
        run: dotnet nuget push package-output\*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/Beckhoff-USA-Community/index.json --skip-duplicate
