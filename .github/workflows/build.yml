name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test AdsGamepadService.sln -c Release

      - name: Publish service
        run: dotnet publish src/AdsGamepadService -c Release -r win-x64 --self-contained -o packaging/AdsGamepadService.Service/bin

      - name: Stage package payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/AdsGamepad.Documentation/bin | Out-Null
          Copy-Item README.md packaging/AdsGamepad.Documentation/bin/README.md
          Copy-Item CONFIGURATION.md packaging/AdsGamepad.Documentation/bin/CONFIGURATION.md
          Copy-Item MIGRATION.md packaging/AdsGamepad.Documentation/bin/MIGRATION.md
          Copy-Item tccom/README.md packaging/AdsGamepad.Documentation/bin/TcComModule.md
          robocopy Documentation/docs packaging/AdsGamepad.Documentation/bin/site *.md *.png *.svg /S | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Staging the documentation site failed, robocopy code $LASTEXITCODE." }
          cmd /c exit 0
          $tsprojFiles = Get-ChildItem tccom, plc -Recurse -Filter *.tsproj
          foreach ($tsproj in $tsprojFiles) {
            if (Select-String -Path $tsproj.FullName -Pattern 'TargetNetId="[^"]' -Quiet) {
              throw "A committed project file carries a TargetNetId: $($tsproj.FullName). Set the project target to Local."
            }
          }

      - name: Check version consistency
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
          [xml]$service = Get-Content packaging/AdsGamepadService.Service/AdsGamepadService.Service.nuspec
          [xml]$xar = Get-Content packaging/AdsGamepad.XAR/AdsGamepad.XAR.Workload.nuspec
          [xml]$xae = Get-Content packaging/AdsGamepad.XAE/AdsGamepad.XAE.Workload.nuspec
          [xml]$library = Get-Content packaging/AdsGamepad.PlcLibrary/AdsGamepad.PlcLibrary.nuspec
          [xml]$docs = Get-Content packaging/AdsGamepad.Documentation/AdsGamepad.Documentation.nuspec
          [xml]$tccom = Get-Content packaging/AdsGamepad.TcCom/AdsGamepad.TcCom.nuspec
          [xml]$csproj = Get-Content src/AdsGamepadService/AdsGamepadService.csproj

          # The release train: tag, csproj, service package and both workloads
          $train = @(
            $service.package.metadata.version,
            $xar.package.metadata.version,
            $xae.package.metadata.version,
            (($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1)
          )
          $mismatched = $train | Where-Object { $_ -ne $tagVersion }
          if ($mismatched) {
            throw "Version mismatch: tag $tagVersion but found $($train -join ', '). Update the csproj, the service nuspec and both workload nuspecs before tagging."
          }

          # A workload must pin every dependency at the version being shipped,
          # otherwise a released workload pulls an outdated component
          function Get-PinnedVersion([xml]$nuspec, [string]$id) {
            ($nuspec.package.metadata.dependencies.dependency | Where-Object { $_.id -eq $id }).version
          }
          $pins = @(
            @{ Nuspec = $xar; Id = 'Beckhoff-USA-Community.XAR.Service.AdsGamepad'; Expected = $service.package.metadata.version },
            @{ Nuspec = $xae; Id = 'Beckhoff-USA-Community.XAE.PLC.Lib.AdsGamepad'; Expected = $library.package.metadata.version },
            @{ Nuspec = $xae; Id = 'Beckhoff-USA-Community.XAE.Documentation.AdsGamepad'; Expected = $docs.package.metadata.version },
            @{ Nuspec = $xae; Id = 'Beckhoff-USA-Community.XAE.TcCom.AdsGamepad'; Expected = $tccom.package.metadata.version }
          )
          foreach ($pin in $pins) {
            $actual = Get-PinnedVersion $pin.Nuspec $pin.Id
            if ($actual -ne $pin.Expected) {
              throw "A workload pins $($pin.Id) at $actual but that package version is $($pin.Expected)."
            }
          }

          # The TcCom payload must carry the version folder its install script expects,
          # with the Windows module and the Beckhoff RT Linux TME in place
          $tccomVersion = $tccom.package.metadata.version
          $tccomPayload = "packaging/AdsGamepad.TcCom/repository/Beckhoff Community/ADS_Gamepad/$tccomVersion"
          foreach ($file in "ADS_Gamepad.tmc", "TwinCAT RT (x64)/ADS_Gamepad.tmx", "TwinCAT OS (x64-E)/ADS_Gamepad.tme") {
            if (-not (Test-Path "$tccomPayload/$file")) {
              throw "The TcCom package payload is missing $file under version $tccomVersion. Publish the module at $tccomVersion and refresh the committed payload."
            }
          }

      - name: Pack TwinCAT packages
        shell: pwsh
        run: |
          $nuspecs = @(
            'packaging/AdsGamepadService.Service/AdsGamepadService.Service.nuspec',
            'packaging/AdsGamepad.PlcLibrary/AdsGamepad.PlcLibrary.nuspec',
            'packaging/AdsGamepad.Documentation/AdsGamepad.Documentation.nuspec',
            'packaging/AdsGamepad.TcCom/AdsGamepad.TcCom.nuspec',
            'packaging/AdsGamepad.XAR/AdsGamepad.XAR.Workload.nuspec',
            'packaging/AdsGamepad.XAE/AdsGamepad.XAE.Workload.nuspec'
          )
          foreach ($nuspec in $nuspecs) {
            nuget pack $nuspec -OutputDirectory package-output -NoPackageAnalysis
            if ($LASTEXITCODE -ne 0) { throw "Packing $nuspec failed." }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: twincat-package
          path: package-output/*.nupkg

      - name: Push to GitHub Packages
        if: github.ref_type == 'tag'
        run: dotnet nuget push package-output\*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/Beckhoff-USA-Community/index.json --skip-duplicate

  # Both Debian architectures build natively, so the test suite also runs
  # on a real arm64 machine
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            rid: linux-x64
            debarch: amd64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test AdsGamepadService.sln -c Release

      - name: Publish service
        run: dotnet publish src/AdsGamepadService -c Release -r ${{ matrix.rid }} --self-contained -o linux/publish

      - name: Check the package version against the tag
        if: github.ref_type == 'tag'
        run: |
          tag='${{ github.ref_name }}'
          version=$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' src/AdsGamepadService/AdsGamepadService.csproj | head -n 1)
          if [ "v$version" != "$tag" ]; then
            echo "The project version $version does not match the tag $tag." >&2
            exit 1
          fi

      - name: Build the Debian package
        run: sh linux/build-deb.sh linux/publish linux ${{ matrix.debarch }}

      - uses: actions/upload-artifact@v7
        with:
          name: debian-package-${{ matrix.debarch }}
          path: linux/*.deb

  # A tag push creates a draft release with the Debian packages attached.
  # The notes are written by hand in the draft before publishing.
  release:
    if: github.ref_type == 'tag'
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: debian-package-*
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          if gh api "repos/$GH_REPO/releases" --jq '.[].tag_name' | grep -qx "$GITHUB_REF_NAME"; then
            echo "A release for $GITHUB_REF_NAME already exists, leaving it untouched."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --draft \
            --title "ADS Gamepad Service ${GITHUB_REF_NAME#v}" \
            --notes "The release notes are written here before publishing." \
            *.deb SHA256SUMS
