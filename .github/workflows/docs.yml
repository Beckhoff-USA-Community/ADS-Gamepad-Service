name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'Documentation/**'
  pull_request:
    paths:
      - 'Documentation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build the site
        run: |
          pip install "mkdocs-material>=9"
          mkdocs build --strict -f Documentation/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Documentation/site

  # Publishing needs GitHub Pages enabled for the repository with the
  # GitHub Actions source. Until then, run this manually after enabling it.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
