[project]
site_name = "ADS Gamepad Service"
site_description = "Gamepads as PLC process data over ADS, on TwinCAT Windows and Beckhoff RT Linux systems"
site_url = "https://beckhoff-usa-community.github.io/ADS-Gamepad-Service/"
repo_url = "https://github.com/Beckhoff-USA-Community/ADS-Gamepad-Service"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Installation" = [
    { "Windows" = "installation/windows.md" },
    { "Beckhoff RT Linux" = "installation/linux.md" },
  ] },
  { "Service" = "service.md" },
  { "PLC Library" = "plc-library.md" },
  { "TcCOM Module" = "tccom.md" },
  { "Applications" = "applications.md" },
  { "Migration" = "migration.md" },
  { "Versions and Wire Contract" = "versions.md" },
]

[project.theme]
variant = "classic"
font.text = "Inter"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
