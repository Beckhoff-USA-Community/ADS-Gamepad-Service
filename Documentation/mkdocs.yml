site_name: ADS Gamepad Service
site_description: Gamepads as PLC process data over ADS, on TwinCAT Windows and Beckhoff RT Linux systems
repo_url: https://github.com/Beckhoff-USA-Community/ADS-Gamepad-Service

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - Installation:
      - Windows: installation/windows.md
      - Beckhoff RT Linux: installation/linux.md
  - Service: service.md
  - PLC Library: plc-library.md
  - TcCOM Module: tccom.md
  - Applications: applications.md
  - Migration: migration.md
  - Versions and Wire Contract: versions.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
