site_name: ADS Gamepad Service
site_description: Gamepads as PLC process data over ADS, on TwinCAT Windows and Beckhoff RT Linux systems
site_url: https://beckhoff-usa-community.github.io/ADS-Gamepad-Service/
repo_url: https://github.com/Beckhoff-USA-Community/ADS-Gamepad-Service

theme:
  name: material
  language: en
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation:
      - Windows: installation/windows.md
      - Beckhoff RT Linux: installation/linux.md
  - Service: service.md
  - PLC Library: plc-library.md
  - TcCOM Module: tccom.md
  - Applications: applications.md
  - Migration: migration.md
  - Versions and Wire Contract: versions.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
